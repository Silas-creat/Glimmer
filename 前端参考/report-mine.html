<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>举报记录 · 微光同行</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f1; color: #4a4a42; min-height: 100vh;
  }
  .top {
    position: sticky; top: 0; z-index: 5; background: #f7f5f1;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid #ece8e0;
  }
  .top .back { font-size: 22px; color: #8a8578; cursor: pointer; line-height: 1; }
  .top h1 { font-size: 16px; font-weight: 600; }
  .wrap { padding: 14px 16px 40px; }
  .item {
    background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(80, 70, 55, .05);
  }
  .item .line1 { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .item .ttl { font-size: 14px; color: #4a4a42; }
  .item .st { font-size: 12px; padding: 2px 8px; border-radius: 10px; }
  .st.pending  { background: #fdf1e3; color: #b5824a; }
  .st.handled  { background: #e8f2e2; color: #5f7a4f; }
  .st.rejected { background: #f2efea; color: #9a9488; }
  .item .reason { font-size: 13px; color: #7d786e; line-height: 1.6; }
  .item .time { font-size: 12px; color: #b0aa9c; margin-top: 8px; }
  .empty { text-align: center; color: #b0aa9c; font-size: 14px; padding: 80px 20px; line-height: 2; }
  #toast {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: rgba(0, 0, 0, .78); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
  <link rel="stylesheet" href="ui.css">
</head>
<body>

<div class="top">
  <div class="back" onclick="safeBack('settings.html')">‹</div>
  <h1>举报记录</h1>
</div>

<div class="wrap" id="list"><div class="empty">加载中…</div></div>
<div id="toast"></div>

<script src="api.js"></script>
<script>
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 1600);
}

// 从本站进来的才有上一页可回；直接打开就回设置页
function safeBack(fallback) {
  try {
    if (document.referrer && document.referrer.indexOf(location.host) >= 0) { history.back(); return; }
  } catch (e) {}
  location.replace(fallback || 'settings.html');
}

var TYPE_TEXT = { diary: '日记', comment: '评论', user: '用户', message: '私信' };
var STATUS_TEXT = { pending: '处理中', handled: '已处理', rejected: '不予处理' };

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

async function load() {
  var box = document.getElementById('list');
  var r = await api('/report/mine?size=50');

  if (r.code === 401) { location.replace('login.html'); return; }
  if (r.code !== 0) {
    box.innerHTML = '<div class="empty">' + esc(r.msg || '加载失败') + '</div>';
    return;
  }

  var list = (r.data && r.data.list) || [];
  if (!list.length) {
    box.innerHTML = '<div class="empty">还没有举报记录<br><span style="font-size:13px;">在日记或他人主页右上角「⋯」可以举报</span></div>';
    return;
  }

  // ★ 每条都能点开看详情 ★
  //   原来只有"私信 · #988 / 理由：… / 时间"，看不出到底举报了什么。
  box.innerHTML = '';
  list.forEach(function (x, i) {
    var st = STATUS_TEXT[x.status] || x.status || '处理中';
    var el = document.createElement('div');
    el.className = 'item';
    el.style.cursor = 'pointer';
    el.innerHTML =
      '<div class="line1">'
      + '<div class="ttl">' + esc(TYPE_TEXT[x.targetType] || x.targetType) + ' · #' + esc(x.targetId) + '</div>'
      + '<div class="st ' + esc(x.status || 'pending') + '">' + esc(st) + '</div>'
      + '</div>'
      + '<div class="reason">理由：' + esc(x.reason || '（未填）') + '</div>'
      + '<div class="time">' + esc(x.createdAt || '')
      + '<span style="color:#8aa87c;margin-left:8px;">查看详情 ›</span></div>';
    el.onclick = function () { showDetail(x); };
    box.appendChild(el);
  });
}

// 举报详情弹层
function showDetail(x) {
  var old = document.getElementById('__rdMask');
  if (old) old.remove();

  var info = x.targetInfo || {};
  var LINES = [
    ['类型', TYPE_TEXT[x.targetType] || x.targetType],
    ['发布者', info.nick || ''],
    ['内容', info.content || '（内容已删除或当前不可访问）'],
    ['发布时间', info.dateKey ? (info.createdAt || '') : (info.createdAt || '')],
    ['举报时间', x.createdAt || ''],
    ['举报理由', x.reason || ''],
    ['处理状态', STATUS_TEXT[x.status] || x.status || ''],
  ];

  var rows = LINES.filter(function (p) { return p[1]; }).map(function (p) {
    return '<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f0ece4;">'
      + '<div style="width:58px;flex-shrink:0;color:#a8a294;font-size:12px;padding-top:2px;">' + p[0] + '</div>'
      + '<div style="flex:1;color:#4a4a42;font-size:14px;line-height:1.7;word-break:break-word;">' + esc(p[1]) + '</div>'
      + '</div>';
  }).join('');

  var mask = document.createElement('div');
  mask.id = '__rdMask';
  mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;'
    + 'display:flex;align-items:center;justify-content:center;padding:0 24px;';
  mask.innerHTML =
    '<div style="width:100%;max-width:420px;max-height:85vh;overflow-y:auto;background:#fbfaf8;border-radius:18px;padding:20px;'
    + 'box-shadow:0 12px 40px rgba(0,0,0,.18);">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">'
    + '<b style="font-size:16px;color:#4a4a42;">举报详情</b>'
    + '<span data-close style="color:#a8a294;font-size:13px;cursor:pointer;">关闭</span>'
    + '</div>' + rows + '</div>';

  document.body.appendChild(mask);
  mask.addEventListener('click', function (e) {
    if (e.target === mask || e.target.hasAttribute('data-close')) mask.remove();
  });
}

load();
</script>
</body>
</html>
