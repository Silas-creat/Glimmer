<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我送出去的祝福</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f1; color: #3a3a34; min-height: 100vh;
  }
  header { display: flex; align-items: center; padding: 18px 20px 12px; }
  header .back { font-size: 22px; color: #7d9b6a; cursor: pointer; padding: 0 10px; }
  header .tt { font-size: 17px; color: #4a4a42; }

  .list { padding: 6px 16px 30px; }
  .item {
    background: #fff; border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .item .head {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px;
  }
  .item .to {
    flex: 1; min-width: 0;
    font-size: 14px; color: #7d9b6a;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item .meta { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .item .time { font-size: 11px; color: #c0bab0; }
  .item .more {
    border: none; background: transparent;
    width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1; color: #b8b2a4;
    cursor: pointer; font-family: inherit;
  }
  .item .more:hover, .item .more:active { background: #f2efe9; color: #7d9b6a; }
  .item .body { font-size: 15px; line-height: 1.8; color: #4a4a42; white-space: pre-wrap; word-break: break-word; }

  .empty {
    text-align: center; color: #b8b2a4; font-size: 15px; line-height: 2;
    padding: 30vh 20px 0; transform: translateY(-50%);
  }

  /* 三个点弹出菜单 */
  .menu {
    position: fixed; z-index: 50;
    min-width: 128px;
    background: #fff;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.16);
  }
  .menu[hidden] { display: none !important; }
  .menu button {
    display: block; width: 100%;
    border: none; background: transparent;
    text-align: left;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: #4a4a42;
    cursor: pointer;
  }
  .menu button:hover, .menu button:active { background: #f7f5f1; }
  .menu button.danger { color: #c07362; }

  /* 修改祝福：和“去祝福一下 ta”页保持同一套全屏编辑界面 */
  .editor-mask {
    position: fixed; inset: 0; z-index: 60;
    overflow: hidden;
    background: #2b3a2f;
  }
  .editor-mask[hidden] { display: none !important; }
  #editBg {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600');
  }
  #editBg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(0,0,0,0.32);
  }
  .edit-back {
    position: absolute; top: 20px; left: 20px; z-index: 5;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.28); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
  }
  .edit-back:active { transform: scale(.94); }
  .edit-title {
    position: absolute; top: 90px; left: 0; right: 0; z-index: 3;
    text-align: center; color: #fff;
    font-size: 20px; letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    padding: 0 30px;
  }
  #editText {
    position: absolute; z-index: 3;
    left: 30px; right: 30px; top: 170px; bottom: 140px;
    background: transparent; border: none; outline: none; resize: none;
    color: #fff; font-size: 17px; line-height: 2;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
    font-family: inherit;
  }
  #editText::placeholder { color: rgba(255,255,255,0.65); }
  #editSaveBtn {
    position: absolute; z-index: 3;
    left: 50%; bottom: 44px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.9); color: #4a4a42;
    border: none; border-radius: 24px;
    padding: 13px 30px; font-size: 15px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    font-family: inherit;
  }
  #editSaveBtn:active { transform: translateX(-50%) scale(.96); }
  #editSaveBtn .plane { font-size: 17px; }

  #toast {
    position: fixed; left: 50%; bottom: 40px;
    transform: translate(-50%, 8px);
    z-index: 70;
    background: rgba(50,50,50,0.9);
    color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .empty { pointer-events: none; }
  .empty .empty-link { pointer-events: auto; text-decoration: underline; cursor: pointer; }
</style>
  <link rel="stylesheet" href="ui.css">
</head>
<body>

<header>
  <div class="back" onclick="goBackSafe()">‹</div>
  <div class="tt">我送出去的祝福</div>
</header>

<div class="list" id="list"></div>

<!-- 三个点菜单 -->
<div class="menu" id="menu" hidden>
  <button data-action="edit">修改</button>
  <button data-action="withdraw" class="danger">撤回</button>
  <button data-action="pin">置顶</button>
</div>

<!-- 修改祝福：与祝福页同款全屏编辑界面 -->
<div class="editor-mask" id="editMask" hidden>
  <div id="editBg"></div>
  <div class="edit-back" onclick="closeEdit()">‹</div>
  <div class="edit-title" id="editTitle">修改祝福</div>
  <textarea id="editText" maxlength="200" placeholder="写一句祝福吧…"></textarea>
  <button id="editSaveBtn" onclick="saveEdit()">
    <span class="plane">✈</span> 保存
  </button>
</div>

<div id="toast"></div>

<script src="api.js"></script>
<script>
const listEl = document.getElementById('list');
const menuEl = document.getElementById('menu');
const editMask = document.getElementById('editMask');
const editTitle = document.getElementById('editTitle');
const editText = document.getElementById('editText');
const toastEl = document.getElementById('toast');

let data = [];
const listType = new URLSearchParams(location.search).get('type') === 'received' ? 'received' : 'sent';
// 标题跟着 type 走（blessTitle）：不然收到的祝福顶着「送出去的」标题
(function blessTitle() {
  var t = listType === 'sent' ? '我送出去的祝福' : '我收到的祝福';
  document.title = t;
  var tt = document.querySelector('header .tt');
  if (tt) tt.textContent = t;
})();

async function loadData() {
  const res = await api('/bless/' + listType);
  if (res.code !== 0) { showToast(res.msg || '加载失败'); return; }
  data = (res.data.list || []).map(function (b) {
    return {
      id: b.id,
      to: listType === 'sent' ? ((b.to && (b.to.nick || b.to.nickname)) || 'ta') : ((b.from && (b.from.nick || b.from.nickname)) || '一位陌生人'),
      text: b.content,
      time: (b.createdAt || '').slice(5, 16).replace('-', '.'),
    };
  });
  render();
}

let currentIndex = -1;
let editIndex = -1;
let toastTimer = null;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function persist() {
  // 数据在后端，不再写本地
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
}

function render() {
  listEl.innerHTML = '';

  if (!data.length) {
    // 原来这行只是文字，点了没反应；现在能跳去写
    const tip = listType === 'sent'
      ? '你还没有送出过祝福<br>写下的祝福会出现在这里'
      : '还没有收到祝福<br>收到的祝福会出现在这里';
    listEl.innerHTML = '<div class="empty">' + tip + '</div>';
    // ★ 只让带下划线的字可点，盒子本身不接收点击 ★
    //   .empty 有 30vh 上内边距 + translateY(-50%)，视觉上文字居中，
    //   实际盒子会顶出屏幕盖住左上角的返回按钮 —— 点返回会跳到漂流瓶。
    return;
  }

  data.forEach(function (b, i) {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div class="head">
        <div class="to">✈ ${listType === 'sent' ? '给 ' : '来自 '}${esc(b.to || 'ta')}</div>
        <div class="meta">
          <div class="time">${esc(b.time || '')}</div>
          <button class="more" data-index="${i}" aria-label="更多操作" title="更多操作">⋯</button>
        </div>
      </div>
      <div class="body">${esc(b.text || '')}</div>
    `;
    listEl.appendChild(div);
  });
}

// 点击三个点，在按钮下方弹出菜单
function showMenu(btn, index) {
  currentIndex = index;
  menuEl.hidden = false;

  const rect = btn.getBoundingClientRect();
  const mw = menuEl.offsetWidth || 128;
  const mh = menuEl.offsetHeight || 128;

  let left = rect.right - mw;
  left = Math.max(12, Math.min(left, window.innerWidth - mw - 12));

  let top = rect.bottom + 6;
  if (top + mh > window.innerHeight - 12) {
    top = rect.top - mh - 6;
  }
  top = Math.max(12, top);

  menuEl.style.left = left + 'px';
  menuEl.style.top = top + 'px';
}

function hideMenu() {
  menuEl.hidden = true;
  currentIndex = -1;
}

listEl.addEventListener('click', function (e) {
  const btn = e.target.closest('.more');
  if (!btn) return;
  e.stopPropagation();
  if (!menuEl.hidden && String(currentIndex) === btn.dataset.index) {
    hideMenu();
    return;
  }
  showMenu(btn, Number(btn.dataset.index));
});

menuEl.addEventListener('click', function (e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const index = currentIndex;
  hideMenu();
  if (index < 0 || index >= data.length) return;

  if (action === 'edit') {
    openEdit(index);
  } else if (action === 'withdraw') {
    withdraw(index);
  } else if (action === 'pin') {
    pin(index);
  }
});

function openEdit(index) {
  if (index < 0 || index >= data.length) return;
  editIndex = index;
  editTitle.textContent = '给 ' + (data[index].to || 'ta') + ' 的祝福';
  editText.value = data[index].text || '';
  editMask.hidden = false;
  document.body.style.overflow = 'hidden';
  editText.focus();
  editText.setSelectionRange(editText.value.length, editText.value.length);
}

function closeEdit() {
  editMask.hidden = true;
  document.body.style.overflow = '';
  editIndex = -1;
}

function saveEdit() {
  if (editIndex < 0 || editIndex >= data.length) { closeEdit(); return; }
  const text = editText.value.trim();
  if (!text) { alert('祝福不能为空'); editText.focus(); return; }
  const target = data[editIndex];
  data[editIndex].text = text;
  closeEdit();
  render();
  api('/bless/' + target.id, { method: 'PUT', body: { content: text } }).then(function (r) {
    showToast(r.code === 0 ? '已修改' : (r.msg || '修改失败'));
    if (r.code !== 0) loadData();
  });
}

function withdraw(index) {
  if (!confirm('确定撤回这条祝福吗？')) return;
  const target = data[index];
  data.splice(index, 1);
  render();
  api('/bless/' + target.id, { method: 'DELETE' }).then(function (r) {
    showToast(r.code === 0 ? '已撤回' : (r.msg || '撤回失败'));
    if (r.code !== 0) loadData();
  });
}

function pin(index) {
  if (index <= 0) { showToast('已经在最上面了'); return; }
  const item = data.splice(index, 1)[0];
  data.unshift(item);
  persist();
  render();
  showToast('已置顶');
}

// 点空白处、滚动、按 Esc 关闭菜单
document.addEventListener('click', function (e) {
  if (menuEl.hidden) return;
  if (menuEl.contains(e.target) || e.target.closest('.more')) return;
  hideMenu();
});
window.addEventListener('scroll', hideMenu, true);
window.addEventListener('resize', hideMenu);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    hideMenu();
    closeEdit();
  }
});

loadData();
function goBackSafe() {
  // 左上角返回固定回「我的」主页（不是 history.back）
  // 从漂流瓶进来时 history.back 会回漂流瓶，和按钮的语义不符
  location.href = 'mine.html';
}
</script>
<script id="__sessionGuard">
// ============================================================
//  登录状态心跳（session guard）
//
//  问题：手机登录把电脑顶下线之后，电脑那边不会立刻知道 ——
//        它不主动问后端，页面就一直显示着（要手动刷新才跳登录页）。
//
//  做法：凡是需要登录的页面，每 20 秒问一次 /api/auth/me。
//        如果账号被顶了，后端返回 401，api.js 统一处理：
//        清 token + 跳登录页（并说明"账号已在别处登录"）。
//
//  细节：
//    · 没 token（游客）不问，省流量
//    · 页面在后台（切到别的标签页）不轮询，切回来立刻问一次
//    · 登录页自己不跑（本来就在登录页）
// ============================================================
(function () {
  var POLL_MS = 10000;
  var hidden = false;

  function hasToken() {
    try { return !!localStorage.getItem('wg_token'); } catch (e) { return false; }
  }

  function ping() {
    if (hidden || !hasToken()) return;
    if (typeof api !== 'function') return;
    // silent401 = false：一旦 401，api.js 会清 token 并跳登录页
    try { api('/auth/me'); } catch (e) { /* 忽略 */ }
  }

  document.addEventListener('visibilitychange', function () {
    hidden = document.hidden;
    if (!hidden) ping();          // 从后台切回来，立刻确认一次
  });

  setInterval(ping, POLL_MS);

  // 页面刚打开先问一次（进首页时如果票已经失效，立刻就能发现）
  setTimeout(ping, 1500);
})();

</script>
</body>
</html>
