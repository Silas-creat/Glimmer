<meta charset="UTF-8">

<title>我的日记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ink: #4a4a42;
    --muted: #b0aa9c;
    --faint: #d8d4cc;
    --accent: #7d9b6a;
    --accent-dark: #5f7a4f;
    --today: #e8e3db;
    --surface: rgba(255,255,255,.58);
    --line: rgba(125,155,106,.16);
    --tab-bg: rgba(251,250,248,.84);
    --active-bg: rgba(125,155,106,.13);
    --shadow: rgba(125,155,106,.28);
    --veil-top: rgba(247,245,241,.55);
    --veil-bottom: rgba(247,245,241,.72);
    --page-bg: #f7f5f1;
    --bg-image: url('assets/diary-month/03.jpg');
  }

  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background-color: var(--page-bg);
    /* 只留一层很淡的白纱，让月份背景图和毛毡纹理真正露出来 */
    background-image: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.30)), var(--bg-image);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
    transition: background-color .35s ease;
  }

  .page {
    flex: 1; min-height: 0;
    width: 100%; max-width: 960px;
    margin: 0 auto;
    padding: 14px 12px 10px;
    display: flex; flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .month-title {
    flex-shrink: 0;
    text-align: center;
    color: var(--accent-dark);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 14px rgba(255,255,255,.75);
  }

  .month-sub {
    flex-shrink: 0;
    text-align: center;
    padding: 5px 0 12px;
  }
  .month-sub .terms {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.2px;
    text-shadow: 0 1px 6px rgba(255,255,255,.45);
  }
  .month-sub .sep { margin: 0 7px; color: var(--faint); }
  #monthTemp { color: var(--accent-dark); }
  .month-sub .poem {
    font-size: 13px;
    color: var(--ink);
    opacity: .74;
    margin-top: 3px;
    letter-spacing: .5px;
    text-shadow: 0 1px 6px rgba(255,255,255,.45);
  }

  .calendar-card {
    width: 100%;
    flex: 0 0 auto;
    margin-top: 10px;
    background: rgba(255,255,255,.62);
    border: 1px solid rgba(255,255,255,.58);
    border-radius: 26px;
    padding: 18px 20px 14px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 38px rgba(30,45,35,.09);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    color: var(--accent-dark);
  }
  .cal-header .arrow {
    font-size: 22px;
    cursor: pointer;
    padding: 2px 12px;
    border-radius: 50%;
    user-select: none;
  }
  .cal-header .arrow:active { background: var(--active-bg); }
  .cal-month {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
  }

  .emoji-hint {
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--accent-dark);
    background: var(--active-bg);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: .5px;
    margin: 3px auto 8px;
  }
  .emoji-hint strong { font-weight: 600; }
  .emoji-hint .hint-face { font-size: 13px; line-height: 1; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: var(--accent-dark);
    font-weight: 600;
    font-size: 13px;
    padding-bottom: 6px;
    flex-shrink: 0;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    align-content: start;
    flex: 0 0 auto;
  }

  .day-cell {
    position: relative;
    min-height: 76px;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    padding: 2px 0;
    transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .day-cell:not(.other-month) { cursor: pointer; }
  .day-cell:not(.other-month):hover {
    transform: translateY(-1px) scale(1.04);
    box-shadow: 0 3px 10px rgba(40,55,40,.08);
  }
  .day-cell:not(.other-month):not(.done):not(.today):hover {
    background: var(--active-bg);
  }
  .day-cell.other-month { color: var(--faint); cursor: default; }
  .day-cell.done { background: var(--today); color: var(--accent-dark); }
  .day-cell.today { background: var(--accent); color: #fff; font-weight: 700; }
  .day-num { line-height: 1.1; }
  .emoji-display {
    width: 31px; height: 31px;
    border-radius: 50%;
    object-fit: cover;
    margin-top: 2px;
  }

  @media (min-width: 700px) {
    .day-cell { min-height: 88px; font-size: 21px; }
    .day-num { font-size: 21px; }
    .emoji-display { width: 34px; height: 34px; }
    .days-grid { gap: 6px; }
  }

  .today-wrap {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    padding-top: 10px;
  }
  .today-btn {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 14px var(--shadow);
  }
  .today-btn:active { transform: scale(.95); }

  /* 底部导航 */
  #tabbar {
    display: flex;
    border-top: 1px solid var(--line);
    background: var(--tab-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    flex-shrink: 0;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 10px 0 12px;
    font-size: 12px; color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .tab.on {
    color: var(--accent-dark);
    background: var(--active-bg);
    border-radius: 10px; margin: 4px; padding: 6px 0 8px;
  }
  .tab .ico { font-size: 20px; display: block; margin-bottom: 2px; }

  /* 长按日期弹出的心情气泡 */
  .emoji-popover {
    display: none;
    position: fixed;
    z-index: 1000;
    background: #fff;
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
    flex-direction: row;
    align-items: center;
    gap: 6px;
    max-width: calc(100vw - 20px);
  }
  .emoji-popover::after {
    content: '';
    position: absolute;
    bottom: -8px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #fff;
    left: var(--arrow-pos, 50%);
    transform: translateX(-50%);
  }
  .emoji-popover.below::after {
    bottom: auto;
    top: -8px;
    border-top: none;
    border-bottom: 8px solid #fff;
  }
  .emoji-img {
    width: 48px; height: 48px;
    border-radius: 50%;
    object-fit: cover;
    cursor: pointer;
    padding: 1px;
    transition: background .15s;
  }
  .emoji-img:active { background: #f0f0f0; }
  /* 桌面端用参考图里的 2cm 大小 */
  @media (min-width: 700px) {
    .emoji-img { width: 2cm; height: 2cm; }
  }

let entriesCache = {};
function getEntries() { return entriesCache; }

async function loadEntries() {
  if (!getToken()) { location.href = 'login.html'; return; }
  const res = await api('/diary/mine?size=50');
  if (res.code !== 0) { return; }
  const map = {};
  (res.data.list || []).forEach(function (d) {
    map[d.day] = {
      id: d.id,
      text: d.content,
      img: d.cover || '',
      isPublic: d.visibility === 'public',
      time: d.createdAt
    };
  });
  entriesCache = map;
}
function keyOf(y, m, d) { return y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0'); }

function applyTheme(m) {
  const t = THEMES[m];
  const c = t.c;
  const r = document.documentElement.style;

  r.setProperty('--ink', c.ink);
  r.setProperty('--muted', c.muted);
  r.setProperty('--faint', c.faint);
  r.setProperty('--accent', c.accent);
  r.setProperty('--accent-dark', c['accent-dark']);
  r.setProperty('--today', c.today);
  r.setProperty('--surface', c.surface);
  r.setProperty('--line', c.line);
  r.setProperty('--tab-bg', c['tab-bg']);
  r.setProperty('--active-bg', c['active-bg']);
  r.setProperty('--shadow', c.shadow);
  r.setProperty('--veil-top', c['veil-top']);
  r.setProperty('--veil-bottom', c['veil-bottom']);
  r.setProperty('--page-bg', c['page-bg']);
  r.setProperty('--bg-image', 'url("' + t.img + '")');

  document.getElementById('monthTerm').textContent = t.term;
  document.getElementById('monthTemp').textContent = t.temp;
  document.getElementById('monthPoem').textContent = t.poem;
}

function renderCalendar() {
  const theme = THEMES[curM];
  document.getElementById('monthTitle').textContent = curY + ' 年 ' + MONTH_NAMES[curM];
  document.getElementById('calMonthText').textContent = MONTH_NAMES[curM];
  applyTheme(curM);
  document.getElementById('monthPoem').textContent = theme.poem;

  grid.innerHTML = '';

  const firstDay = new Date(curY, curM, 1).getDay();
  const daysInMonth = new Date(curY, curM + 1, 0).getDate();
  const prevDays = new Date(curY, curM, 0).getDate();
  const today = new Date();

  // 上月补位
  for (let i = firstDay; i > 0; i--) {
    grid.appendChild(createCell(prevDays - i + 1, true, null));
  }

  // 当月
  for (let d = 1; d <= daysInMonth; d++) {
    const key = keyOf(curY, curM, d);
    const isToday = (curY === today.getFullYear() && curM === today.getMonth() && d === today.getDate());
    grid.appendChild(createCell(d, false, key, isToday));
  }

  // 不再补下个月的日期：少一行灰字，日历更紧凑，
  // 也能把页面空间留给背景图。
}

function createCell(day, isOther, key, isToday) {
  const cell = document.createElement('div');
  cell.className = 'day-cell' + (isOther ? ' other-month' : '');
  if (!isOther && isToday) cell.classList.add('today');

  const entries = getEntries();
  if (!isOther && key && entries[key]) cell.classList.add('done');

  const num = document.createElement('div');
  num.className = 'day-num';
  num.textContent = day;
  cell.appendChild(num);

  if (!isOther && key) {
    if (dayEmojis[key]) {
      const em = document.createElement('img');
      em.className = 'emoji-display';
      em.src = 'assets/calendar/' + dayEmojis[key] + '.png';
      em.alt = '';
      cell.appendChild(em);
    }
    bindLongPress(cell, key);
  }

  return cell;
}

function bindLongPress(cell, key) {
  let startX = 0, startY = 0, moved = false;
  let touchUsed = false;

  function begin(x, y) {
    selectedKey = key;
    longPressed = false;
    moved = false;
    startX = x;
    startY = y;
    clearTimeout(pressTimer);
    // 按住 2 秒弹出心情
    pressTimer = setTimeout(function () {
      longPressed = true;
      openPopover(cell);
    }, 2000);
  }

  function moveTo(x, y) {
    if (Math.abs(x - startX) > 10 || Math.abs(y - startY) > 10) {
      moved = true;
      clearTimeout(pressTimer);
    }
  }

  function finish() {
    clearTimeout(pressTimer);
    if (!longPressed && !moved) goWriteDiary(key);
  }

  function cancel() {
    moved = true;
    clearTimeout(pressTimer);
  }

  cell.addEventListener('touchstart', function (e) {
    touchUsed = true;
    const t = e.touches[0];
    begin(t.clientX, t.clientY);
  }, { passive: true });

  cell.addEventListener('touchmove', function (e) {
    const t = e.touches[0];
    moveTo(t.clientX, t.clientY);
  }, { passive: true });

  cell.addEventListener('touchend', function () {
    finish();
    setTimeout(function () { touchUsed = false; }, 600);
  });

  cell.addEventListener('touchcancel', function () {
    cancel();
    setTimeout(function () { touchUsed = false; }, 600);
  });

  // 电脑端：鼠标按住 2 秒
  cell.addEventListener('mousedown', function (e) {
    if (touchUsed || e.button !== 0) return;
    begin(e.clientX, e.clientY);
  });

  cell.addEventListener('mousemove', function (e) {
    if (touchUsed || e.buttons !== 1) return;
    moveTo(e.clientX, e.clientY);
  });

  cell.addEventListener('mouseup', function () {
    if (touchUsed) return;
    finish();
  });

  cell.addEventListener('mouseleave', function () {
    if (touchUsed) return;
    clearTimeout(pressTimer);
  });

  cell.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

function openPopover(cell) {
  popover.style.display = 'flex';

  const rect = cell.getBoundingClientRect();
  const pw = popover.offsetWidth;
  const ph = popover.offsetHeight;

  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(10, Math.min(left, window.innerWidth - pw - 10));

  let top = rect.top - ph - 10;
  let below = false;
  if (top < 10) {
    top = rect.bottom + 10;
    below = true;
  }

  popover.classList.toggle('below', below);
  popover.style.left = left + 'px';
  popover.style.top = top + 'px';

  const arrowPos = rect.left + rect.width / 2 - left;
  popover.style.setProperty('--arrow-pos', arrowPos + 'px');
}

function pickEmoji(em) {
  if (selectedKey) {
    dayEmojis[selectedKey] = em;
    try { localStorage.setItem(EMOJI_KEY, JSON.stringify(dayEmojis)); } catch (e) {}
    renderCalendar();
  }
  popover.style.display = 'none';
}

function goWriteDiary(key) {
  // 用 push 而不是 replace：这样在写日记页按浏览器返回键，
  // 回到的是日历日期页，而不是日历之前的页面。
  location.href = 'diary-write.html?date=' + key;
}

function changeMonth(step) {
  curM += step;
  if (curM < 0) { curM = 11; curY--; }
  if (curM > 11) { curM = 0; curY++; }
  renderCalendar();
}

function goToday() {
  const t = new Date();
  curY = t.getFullYear();
  curM = t.getMonth();
  renderCalendar();
}

document.addEventListener('pointerdown', function (e) {
  if (popover.style.display === 'flex' && !popover.contains(e.target)) {
    popover.style.display = 'none';
  }
});

(async function init() {
  await loadEntries();
  renderCalendar();
})();
</script>
<script id="__bfcacheGuard">
// ============================================================
//  bfcache 兜底：从浏览器缓存里"恢复"的页面要重新拉一次数据
//
//  背景：删完日记 history.back() 回「我的」，浏览器直接从 bfcache
//        把旧页面还原，脚本不重跑 → 列表里那篇已删除的日记还在。
//        删日记那一侧改成 location.replace() 之后这条路已经绕开了，
//        但别的返回路径（详情页返回、手机侧滑返回）同样会命中 bfcache，
//        所以列表页自己也兜一层。
//
//  做法：pageshow 事件里判断 e.persisted（true = 从 bfcache 恢复）。
//        有现成的加载函数就调它，没有就整页重载。
// ============================================================
(function () {
  var LOADERS = ['loadEntries', 'loadList', 'load', 'refreshList', 'renderList'];

  function reloadData() {
    for (var i = 0; i < LOADERS.length; i++) {
      var fn = window[LOADERS[i]];
      if (typeof fn === 'function') {
        try { fn(); return; } catch (e) { /* 换下一个 */ }
      }
    }
    // 找不到加载函数就整页重载 —— 保证用户看到的是最新数据
    location.reload();
  }

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) reloadData();
  });
})();

</script>
<script id="__sessionGuard">
// ============================================================
//  登录状态心跳（session guard）
//
//  问题：手机登录把电脑顶下线之后，电脑那边不会立刻知道 ——
//        它不主动问后端，页面就一直显示着（要手动刷新才跳登录页）。
//
//  做法：凡是需要登录的页面，每 20 秒问一次 /api/auth/me。
//        如果账号被顶了，后端返回 401，api.js 统一处理：
//        清 token + 跳登录页（并说明"账号已在别处登录"）。
//
//  细节：
//    · 没 token（游客）不问，省流量
//    · 页面在后台（切到别的标签页）不轮询，切回来立刻问一次
//    · 登录页自己不跑（本来就在登录页）
// ============================================================
(function () {
  var POLL_MS = 10000;
  var hidden = false;

  function hasToken() {
    try { return !!localStorage.getItem('wg_token'); } catch (e) { return false; }
  }

  function ping() {
    if (hidden || !hasToken()) return;
    if (typeof api !== 'function') return;
    // silent401 = false：一旦 401，api.js 会清 token 并跳登录页
    try { api('/auth/me'); } catch (e) { /* 忽略 */ }
  }

  document.addEventListener('visibilitychange', function () {
    hidden = document.hidden;
    if (!hidden) ping();          // 从后台切回来，立刻确认一次
  });

  setInterval(ping, POLL_MS);

  // 页面刚打开先问一次（进首页时如果票已经失效，立刻就能发现）
  setTimeout(ping, 1500);
})();

</script>
