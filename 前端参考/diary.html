<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #f4efdf; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }

  #stage {
    position: relative;
    width: 100%;
    height: calc(100vh - 68px - env(safe-area-inset-bottom));
    height: calc(100dvh - 68px - env(safe-area-inset-bottom));
    overflow: hidden;
    background: #f4efdf;
  }

  /* 原图为 2000 × 1152；图和门的入口共用一个等比坐标系。
     窄屏最多放大到页面宽度的 2.1 倍，只裁两侧风景，保留完整双门。 */
  .door-scene {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    /* 174vh − 118px ≈ (viewport height − nav height) × 1.736111.
       Keep the multiplication outside calc so older mobile WebViews parse it. */
    width: min(210%, calc(174vh - 118px));
    width: min(210%, calc(174dvh - 118px));
    aspect-ratio: 125 / 72;
  }
  #stage .bg {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
    pointer-events: none;
  }

  /* 热区沿原图门扇轮廓设置，门外的风景和中间通道不触发跳转。 */
  .door-link {
    position: absolute;
    z-index: 2;
    cursor: pointer;
    top: 15.2778%;
    height: 71.5278%;
    transition: background-color .15s;
    -webkit-touch-callout: default;
  }
  .door-mine {
    left: 31.6%;
    width: 13.85%;
    clip-path: polygon(89% 0, 97% 2%, 100% 97%, 91% 100%, 3% 93%, 0 42%, 6% 28%, 17% 18%, 36% 10%, 63% 4%);
  }
  .door-public {
    left: 54.7%;
    width: 13.6%;
    clip-path: polygon(10% 0, 37% 6%, 64% 15%, 82% 28%, 94% 44%, 100% 93%, 10% 100%, 0 97%, 0 2%);
  }
  .door-link:hover, .door-link:active { background: rgba(255, 255, 255, .18); }
  .door-link:focus-visible { background: rgba(255, 255, 255, .25); outline: none; }
  .door-label {
    position: absolute;
    z-index: 3;
    top: 88.5%;
    transform: translateX(-50%);
    padding: 7px 12px;
    border: 1px solid rgba(255, 255, 255, .75);
    border-radius: 999px;
    background: rgba(255, 252, 244, .86);
    font-size: clamp(12px, 3.1vw, 15px);
    line-height: 1.4;
    letter-spacing: .03em;
    white-space: nowrap;
    pointer-events: auto;
    text-decoration: none;
  }
  .label-mine { left: 38%; color: #385f78; }
  .label-public { left: 62%; color: #82563c; }
  .door-link:focus-visible + .door-label, .door-label:focus-visible {
    outline: 3px solid currentColor;
    outline-offset: 4px;
    background: #fffcf4;
  }
  @media (prefers-reduced-motion: reduce) {
    .door-link { transition: none; }
  }

  /* 底部导航 */
  #tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; border-top: 1px solid #e6e2da;
    background: #fbfaf8;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1; text-align: center;
    padding: 10px 0 12px;
    font-size: 12px; color: #a8a294;
    cursor: pointer; user-select: none;
  }
  .tab.on {
    color: #2b7fff; background: #e8f1ff;
    border-radius: 10px; margin: 4px; padding: 6px 0 8px;
  }
  .tab .ico { font-size: 20px; display: block; margin-bottom: 2px; }
</style>
  <link rel="stylesheet" href="ui.css">
</head>
<body>

<main id="stage" aria-label="日记入口">
  <div class="door-scene">
    <img class="bg" src="assets/diary/doors.jpg" width="2000" height="1152"
         alt="水彩画中的两扇敞开的门：左侧是蓝色的门，右侧是暖色的门">
    <a class="door-link door-mine" href="diary-mine.html"
       aria-labelledby="mine-label" title="留下我的痕迹"></a>
    <a class="door-label label-mine" id="mine-label" href="diary-mine.html">留下我的痕迹</a>
    <a class="door-link door-public" href="diary-public.html?feed=follow"
       aria-labelledby="public-label" title="看看 ta 的"></a>
    <a class="door-label label-public" id="public-label" href="diary-public.html?feed=follow">看看 ta 的</a>
  </div>
</main>

<div id="tabbar">
  <div class="tab" onclick="location.href='index.html?logged=1'"><span class="ico">⌂</span>首页</div>
  <div class="tab" onclick="location.href='index.html?logged=1&tab=friend'"><span class="ico">☰</span>好友</div>
  <div class="tab" onclick="location.href='discover.html'"><span class="ico">◎</span>发现</div>
  <div class="tab on" onclick="location.href='diary.html'"><span class="ico">✎</span>日记</div>
  <div class="tab" onclick="location.href='mine.html'"><span class="ico">☺</span>我的</div>
</div>

<script id="__bfcacheGuard">
// ============================================================
//  bfcache 兜底：从浏览器缓存里"恢复"的页面要重新拉一次数据
//
//  背景：删完日记 history.back() 回「我的」，浏览器直接从 bfcache
//        把旧页面还原，脚本不重跑 → 列表里那篇已删除的日记还在。
//        删日记那一侧改成 location.replace() 之后这条路已经绕开了，
//        但别的返回路径（详情页返回、手机侧滑返回）同样会命中 bfcache，
//        所以列表页自己也兜一层。
//
//  做法：pageshow 事件里判断 e.persisted（true = 从 bfcache 恢复）。
//        有现成的加载函数就调它，没有就整页重载。
// ============================================================
(function () {
  var LOADERS = ['loadEntries', 'loadList', 'load', 'refreshList', 'renderList'];

  function reloadData() {
    for (var i = 0; i < LOADERS.length; i++) {
      var fn = window[LOADERS[i]];
      if (typeof fn === 'function') {
        try { fn(); return; } catch (e) { /* 换下一个 */ }
      }
    }
    // 找不到加载函数就整页重载 —— 保证用户看到的是最新数据
    location.reload();
  }

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) reloadData();
  });
})();

</script>
<script id="__sessionGuard">
// ============================================================
//  登录状态心跳（session guard）
//
//  问题：手机登录把电脑顶下线之后，电脑那边不会立刻知道 ——
//        它不主动问后端，页面就一直显示着（要手动刷新才跳登录页）。
//
//  做法：凡是需要登录的页面，每 20 秒问一次 /api/auth/me。
//        如果账号被顶了，后端返回 401，api.js 统一处理：
//        清 token + 跳登录页（并说明"账号已在别处登录"）。
//
//  细节：
//    · 没 token（游客）不问，省流量
//    · 页面在后台（切到别的标签页）不轮询，切回来立刻问一次
//    · 登录页自己不跑（本来就在登录页）
// ============================================================
(function () {
  var POLL_MS = 10000;
  var hidden = false;

  function hasToken() {
    try { return !!localStorage.getItem('wg_token'); } catch (e) { return false; }
  }

  function ping() {
    if (hidden || !hasToken()) return;
    if (typeof api !== 'function') return;
    // silent401 = false：一旦 401，api.js 会清 token 并跳登录页
    try { api('/auth/me'); } catch (e) { /* 忽略 */ }
  }

  document.addEventListener('visibilitychange', function () {
    hidden = document.hidden;
    if (!hidden) ping();          // 从后台切回来，立刻确认一次
  });

  setInterval(ping, POLL_MS);

  // 页面刚打开先问一次（进首页时如果票已经失效，立刻就能发现）
  setTimeout(ping, 1500);
})();

</script>
</body>
</html>
