<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f7f5f1; color: #3a3a34;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 56px 28px calc(28px + env(safe-area-inset-bottom));
    box-sizing: border-box;
  }

  .logo {
    font-size: 30px; letter-spacing: 8px;
    color: #6b8a58; margin-bottom: 10px; flex-shrink: 0;
  }
  .slogan {
    font-size: 13px; color: #b0aa9c;
    letter-spacing: 1px; margin-bottom: clamp(24px, 8vh, 60px); flex-shrink: 0;
  }

  .field {
    width: 100%; max-width: 340px;
    display: flex; align-items: center;
    background: #fff; border-radius: 12px;
    padding: 0 16px; margin-bottom: 14px;
    height: 50px;
  }
  .field input {
    flex: 1; border: none; outline: none;
    font-size: 15px; color: #3a3a34; background: transparent;
    font-family: inherit;
  }
  .field input::placeholder { color: #c0bab0; }

  #loginBtn {
    width: 100%; max-width: 340px;
    height: 50px; margin-top: 10px;
    border: none; border-radius: 12px;
    background: #a8b89c; color: #fff;
    font-size: 16px; letter-spacing: 2px;
    cursor: pointer;
  }
  #loginBtn:active { transform: scale(.98); }
  #loginBtn:disabled { opacity: .6; }

  .switch {
    margin-top: 18px; font-size: 13px; color: #7d9b6a; cursor: pointer;
  }
  #tip {
    margin-top: 12px; font-size: 12.5px; color: #c07a5a; min-height: 18px; text-align: center;
  }

  .page-back {
    position: fixed; top: 18px; left: 18px; z-index: 50;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.9);
    border: 1px solid #e6e2da;
    color: #7d9b6a;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; cursor: pointer;
  }
  .page-back:active { transform: scale(.94); }

  /* 小屏手机（比如 360×640）把间距收紧一档，保证一屏放得下 */
  @media (max-height: 700px) {
    body { padding: 44px 24px calc(20px + env(safe-area-inset-bottom)); }
    .logo { font-size: 26px; letter-spacing: 6px; }
    .slogan { margin-bottom: 22px; }
    .field { height: 46px; margin-bottom: 12px; }
    #loginBtn { height: 46px; margin-top: 8px; }
  }
</style>
  <link rel="stylesheet" href="ui.css">
</head>
<body>

<div class="page-back" onclick="location.href='index.html'" aria-label="返回">‹</div>
<div class="logo">微光同行</div>
<div class="slogan">这里没人催你</div>

<div class="field">
  <input id="phone" type="tel" placeholder="请输入你的电话号码" maxlength="11" autocomplete="off" />
</div>

<div class="field">
  <input id="password" type="tel" placeholder="验证码（开发期填 123456）" maxlength="32" autocomplete="off" />
</div>

<button id="loginBtn" onclick="submit()">登录</button>
<div id="tip"></div>
<div class="switch" id="switch" onclick="toggleMode()">首次登录会自动创建账号</div>

<script src="api.js"></script>
<script>
let isRegister = false;

function toggleMode() {
  isRegister = !isRegister;
  document.getElementById('loginBtn').textContent = isRegister ? '注册并登录' : '登录';
  document.getElementById('switch').textContent = isRegister ? '已有账号？去登录' : '首次登录会自动创建账号';
  document.getElementById('tip').textContent = '';
}

function showTip(msg, ok) {
  const el = document.getElementById('tip');
  el.textContent = msg || '';
  el.style.color = ok ? '#6b8a58' : '#c07a5a';
}


async function submit() {
  const phone = document.getElementById('phone').value.trim();
  const password = document.getElementById('password').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) return showTip('手机号格式不对');
  if (!password || password.length < 6) return showTip('密码至少 6 位');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  showTip('');

  // 后端用「手机号 + 验证码」登录，首次登录自动注册，所以注册和登录走同一个接口
  const res = await api('/auth/login', { method: 'POST', body: { phone, code: password }, silent401: true });
  btn.disabled = false;

  if (res.code !== 0) {
    // 常见情况给一句更具体的提示，方便现场排错
    let msg = res.msg || '登录失败';
    if (res.code === -1) {
      msg = '连不上后端服务，请先启动 server（cd server && npm start）';
    }
    return showTip(msg);
  }

  setToken(res.data.token);
  setUser(res.data.user);
  try { sessionStorage.setItem('peizhe_logged_in', '1'); } catch (e) {}
  showTip(isRegister ? '注册成功，正在进入…' : '登录成功，正在进入…', true);
  setTimeout(() => { location.href = 'index.html?logged=1'; }, 300);
}
</script>
<script>
// ============================================================
//  登录页：加「创建账号」
//
//  原来的登录页只有一个模式：手机号 + 验证码 → 新号自动注册，
//  昵称是系统给的「微光XXXX」。用户想自己起名字没有入口。
//
//  这里在页面末尾再定义一遍 toggleMode / submit：
//    JS 里同名函数，后面的覆盖前面的，不用改动原稿结构。
//  切到「创建账号」时多出一个昵称输入框，提交打 /auth/register。
// ============================================================
(function () {
  var pw = document.getElementById('password');
  if (!pw) return;

  // ---------- 1. 昵称输入框（默认隐藏，插在验证码下面）----------
  var pwField = pw.parentNode;
  if (!document.getElementById('nickname')) {
    var f = document.createElement('div');
    f.className = 'field';
    f.id = 'nickField';
    f.style.display = 'none';
    f.innerHTML = '<input id="nickname" type="text" placeholder="给自己起个名字（2-16 字）" maxlength="16" autocomplete="off" />';
    pwField.parentNode.insertBefore(f, pwField.nextSibling);
  }

  var REG_MODE = false;

  function applyMode() {
    var nick = document.getElementById('nickField');
    var btn = document.getElementById('loginBtn');
    var sw = document.getElementById('switch');
    if (nick) nick.style.display = REG_MODE ? '' : 'none';
    if (btn) btn.textContent = REG_MODE ? '创建账号' : '登录';
    if (sw) sw.textContent = REG_MODE ? '已有账号？去登录' : '还没有账号？创建一个';
    var tip = document.getElementById('tip');
    if (tip) tip.textContent = '';
  }

  // ---------- 2. 切换登录 / 创建 ----------
  window.toggleMode = function () {
    REG_MODE = !REG_MODE;
    applyMode();
    if (REG_MODE) {
      var n = document.getElementById('nickname');
      if (n) n.focus();
    }
  };

  // ---------- 3. 提交 ----------
  window.submit = async function () {
    var phone = document.getElementById('phone').value.trim();
    var code = document.getElementById('password').value.trim();
    var btn = document.getElementById('loginBtn');

    if (!/^1[3-9]\d{9}$/.test(phone)) return showTip('手机号格式不对');
    if (!/^\d{6}$/.test(code)) return showTip('验证码是 6 位数字（开发期填 123456）');

    var url = '/auth/login';
    // 设备标识：后端靠它判断"同一台设备重登"还是"换设备了"
    var deviceId = '';
    try {
      deviceId = localStorage.getItem('wg_device') || '';
      if (!deviceId) {
        deviceId = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
        localStorage.setItem('wg_device', deviceId);
      }
    } catch (e) {}
    var body = { phone: phone, code: code, deviceId: deviceId };

    if (REG_MODE) {
      var nick = (document.getElementById('nickname').value || '').trim();
      if (nick.length < 2 || nick.length > 16) return showTip('昵称要 2 到 16 个字');
      body.nickname = nick;
      url = '/auth/register';
    }

    btn.disabled = true;
    showTip('');

    var res = await api(url, { method: 'POST', body: body, silent401: true });
    btn.disabled = false;

    if (res.code !== 0) {
      var msg = res.msg || (REG_MODE ? '创建失败' : '登录失败');
      if (res.code === -1) msg = '连不上后端服务，先确认后端在跑';
      // 只有"手机号已注册"才提示去登录；昵称重复跟登录无关，别乱指路
      if (res.code === 40900 && REG_MODE && (res.msg || '').indexOf('手机号') >= 0) {
        msg += '（点下面「已有账号？去登录」）';
      }
      return showTip(msg);
    }

    setToken(res.data.token);
    setUser(res.data.user);
    try { sessionStorage.setItem('peizhe_logged_in', '1'); } catch (e) {}
    showTip(REG_MODE ? '账号创建成功，正在进入…' : '登录成功，正在进入…', true);
    setTimeout(function () { location.href = 'index.html?logged=1'; }, 400);
  };

  // 首次进入就摆正措辞（原稿写的是"首次登录会自动创建账号"）
  applyMode();

  // 被踢下线（或 token 过期）时，把原因说给用户听
  try {
    var why = sessionStorage.getItem('wg_401');
    if (why) {
      sessionStorage.removeItem('wg_401');
      setTimeout(function () { showTip(why); }, 200);
    }
  } catch (e) {}
})();

</script>
</body>
</html>
